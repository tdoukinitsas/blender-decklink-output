schema_version = "1.0.0"

id = "blender_decklink_output"
version = "1.0.0"
name = "Live Camera Output for Blackmagic Design DeckLink"
tagline = "Live output of a scene camera to Blackmagic DeckLink cards"
maintainer = "Thomas Doukinitsas"
type = "add-on"
website = "https://github.com/tdoukinitsas/blender-decklink-output"
tags = ["Render", "Camera", "3D View"]
blender_version_min = "5.0.0"
license = ["SPDX:GPL-3.0-or-later"]
copyright = ["2026 Thomas Doukinitsas"]
platforms = ["windows-x64"]

[permissions]
files = "Caches a copy of its native DLL in the temp folder"

# Used by `blender --command extension build`. scripts/package.py builds the release zip
# and also adds the licence files from the repository root.
[build]
paths_exclude_pattern = [
  "__pycache__/",
  "*.pyc",
  "*.zip",
  "/.*",
]
